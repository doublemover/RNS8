[mypy]
python_version = 3.12
mypy_path = $MYPY_CONFIG_FILE_DIR/tools
namespace_packages = True
explicit_package_bases = True
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
show_error_codes = True
pretty = False
incremental = False
files = tools/json_evidence.py, tools/evidence_scalars.py, tools/execution_environment_contract.py, tools/execution_observation.py, tools/evidence_records.py

[mypy-json_evidence,evidence_scalars,execution_environment_contract,execution_observation,evidence_records]
strict = True
disallow_any_generics = True
disallow_untyped_defs = True
