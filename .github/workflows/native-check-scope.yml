name: Native Check Scope

on:
  workflow_call:
    inputs:
      event:
        type: string
        required: true
      base_sha:
        type: string
        default: ""
    outputs:
      source_required:
        value: ${{ jobs.classify.outputs.source_required }}
      analysis_changed_paths:
        value: ${{ jobs.classify.outputs.analysis_changed_paths }}

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_required: ${{ steps.scope.outputs.source_required }}
      analysis_changed_paths: ${{ steps.scope.outputs.analysis_changed_paths }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          allow-prereleases: false
      - id: scope
        env:
          RNS8_SCOPE_EVENT: ${{ inputs.event }}
          RNS8_SCOPE_BASE: ${{ inputs.base_sha }}
        run: >-
          python tools/ci_change_scope.py --event "$RNS8_SCOPE_EVENT"
          --base-sha "$RNS8_SCOPE_BASE" --github-output "$GITHUB_OUTPUT"
