name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  ubuntu-cpu:
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ runner.temp }}/vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"

      - name: Python tooling tests
        run: |
          python tools/test_check_dependencies.py
          python tools/test_benchmark_schema.py
          python tools/test_result_compare.py
          python tools/test_benchmark_sweep.py
          python tools/test_autotune_cache_install.py
          python tools/check_release_tree.py

      - name: Configure CPU
        run: cmake --preset cpu-debug

      - name: Build CPU
        run: cmake --build --preset cpu-debug

      - name: Test CPU
        run: ctest --preset cpu-debug --output-on-failure
