name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

# Keep the latest branch and PR-merge checks independently. Rapid development
# pushes should not leave obsolete eight-way compiler matrices queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  source-quality:
    name: Source quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            tool-bin: bin
          - os: windows-2025
            tool-bin: Scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Select locked Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          allow-prereleases: false
      - name: Install hash-locked developer tools
        run: python tools/init_quality.py --out temp/quality-tools
      - name: Select hash-locked native CMake
        run: python tools/init_build_tools.py --github-path
      - name: Check canonical source and orchestration
        run: python tools/quality.py check --tool-bin temp/quality-tools/${{ matrix.tool-bin }}
      - name: Prove deliberate checker failures
        run: python tools/quality.py self-test --tool-bin temp/quality-tools/${{ matrix.tool-bin }}
      - name: Check strict evidence boundaries and diagnostic controls
        run: python tools/quality.py types --tool-bin temp/quality-tools/${{ matrix.tool-bin }}
      - name: Check inventory and fixture structure contracts
        run: |
          python tools/test_quality.py
          python tools/test_typecheck.py
          python tools/test_python_case_structure.py

  ubuntu-cpu:
    needs: source-quality
    runs-on: ubuntu-24.04
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node24 runner >=2.327.1
        with:
          submodules: false

      - name: Select locked Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0; Node24 runner >=2.327.1
        with:
          python-version-file: .python-version
          allow-prereleases: false

      - name: Install native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ python3 catch2 nlohmann-json3-dev libboost-dev

      - name: Select locked build tools in a job-local environment
        run: |
          python -m venv temp/dependency-tools
          temp/dependency-tools/bin/python -m pip install --require-hashes --only-binary=:all: --no-deps -r scripts/requirements-build-tools.txt
          echo "$PWD/temp/dependency-tools/bin" >> "$GITHUB_PATH"
          python tools/init_build_tools.py --github-path

      - name: Python tooling tests
        run: |
          python tools/test_dependency_policy.py
          python tools/test_init_build_tools.py
          python tools/check_dependencies.py --check-lock
          python tools/test_documentation.py
          python tools/check_documentation.py
          python tools/test_check_dependencies.py
          python tools/test_benchmark_schema.py
          python tools/test_result_compare.py
          python tools/test_ci_benchmark_smoke.py
          python tools/test_wide_magnitude.py
          python tools/test_collect_queue_calibration.py
          python tools/test_streaming_measurement.py
          python tools/test_public_measurement_contracts.py
          python tools/test_benchmark_sweep.py
          python tools/test_autotune_cache_install.py
          python tools/check_release_tree.py

      - name: Reject Windows vcpkg leakage on Linux
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP"
          cmake -S . -B "$RUNNER_TEMP/rns8-linux-vcpkg-guard" -G Ninja \
            -DRNS8_FORCE_LINUX_NATIVE_DISCOVERY_GUARD=ON \
            -DCMAKE_PREFIX_PATH=/mnt/c/vcpkg/installed/x64-windows \
            -DRNS8_ENABLE_HIP=OFF \
            -DRNS8_BUILD_TESTS=OFF \
            -DRNS8_BUILD_TOOLS=OFF \
            -DRNS8_BUILD_BENCHMARKS=OFF \
            -DRNS8_BUILD_EXAMPLES=OFF \
            > "$RUNNER_TEMP/rns8-linux-vcpkg-guard.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/rns8-linux-vcpkg-guard.log"
          if [ "$status" -eq 0 ]; then
            echo "Expected Linux Windows-vcpkg leakage guard to reject configure"
            exit 1
          fi
          if ! grep -q "Linux/UNIX builds must use native system packages" "$RUNNER_TEMP/rns8-linux-vcpkg-guard.log"; then
            echo "Expected native-package guard message was not emitted"
            exit 1
          fi

      - name: Configure CPU
        run: cmake --preset linux-cpu-debug

      - name: Build CPU
        run: cmake --build --preset linux-cpu-debug

      - name: Replay deterministic arithmetic cases through the native CPU adapter
        run: |
          python tools/fuzz_cases.py --out temp/ci-native-arithmetic-corpus > "$RUNNER_TEMP/rns8-native-corpus.json"
          python tools/fuzz_replay.py \
            --exe build/linux-cpu-debug/rns8-arithmetic-replay \
            --case temp/ci-native-arithmetic-corpus/history-0-7.r8f \
            --case temp/ci-native-arithmetic-corpus/history-1-7.r8f \
            --case temp/ci-native-arithmetic-corpus/metamorphic-2-base.r8f \
            --case temp/ci-native-arithmetic-corpus/history-4-7.r8f \
            --case temp/ci-native-arithmetic-corpus/history-5-7.r8f \
            --backend cpu-reference --device -1 \
            --out temp/ci-native-rns-replay --seconds 120 --case-seconds 20 --execute \
            > temp/ci-native-rns-replay-report.json
          python tools/fuzz_replay.py \
            --exe build/linux-cpu-debug/rns8-arithmetic-replay \
            --case temp/ci-native-arithmetic-corpus/metamorphic-3-base.r8f \
            --backend wrap64-byte-limb --device -1 \
            --out temp/ci-native-wrap-replay --seconds 60 --case-seconds 20 --execute \
            > temp/ci-native-wrap-replay-report.json
          python -c 'import json; from pathlib import Path; reports = [json.loads(Path("temp/ci-native-" + lane + "-replay-report.json").read_text()) for lane in ("rns", "wrap")]; print("Native CPU replay:", [report["counts"] for report in reports]); assert all(report["accepted"] for report in reports)'

      - name: Retain deterministic native CPU replay evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-cpu-arithmetic-replay
          path: |
            temp/ci-native-arithmetic-corpus.manifest.json
            temp/ci-native-rns-replay-report.json
            temp/ci-native-wrap-replay-report.json
            temp/ci-native-rns-replay/
            temp/ci-native-wrap-replay/
          if-no-files-found: ignore

      - name: Test CPU
        run: ctest --preset linux-cpu-debug --output-on-failure

  linux-openmp-matrix:
    needs: source-quality
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        parallel: ["ON", "OFF"]
        shared: ["ON", "OFF"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node24 runner >=2.327.1
      - name: Select locked Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0; Node24 runner >=2.327.1
        with:
          python-version-file: .python-version
          allow-prereleases: false

      - name: Install compiler and native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ clang libomp-dev python3 catch2 nlohmann-json3-dev libboost-dev
      - name: Select locked build tools in a job-local environment
        run: |
          python -m venv temp/dependency-tools
          temp/dependency-tools/bin/python -m pip install --require-hashes --only-binary=:all: --no-deps -r scripts/requirements-build-tools.txt
          echo "$PWD/temp/dependency-tools/bin" >> "$GITHUB_PATH"
          python tools/init_build_tools.py --github-path
      - name: Configure enabled or disabled OpenMP branch
        run: >-
          cmake -S . -B build/ci-openmp -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DRNS8_ENABLE_HIP=OFF
          -DRNS8_ENABLE_CPU_PARALLEL=${{ matrix.parallel }}
          -DRNS8_REQUIRE_OPENMP=${{ matrix.parallel }}
          -DRNS8_BUILD_SHARED=${{ matrix.shared }}
      - name: Compile complete CPU targets
        run: cmake --build build/ci-openmp --parallel 2
      - name: Exercise CPU tests with bounded OpenMP teams
        env:
          OMP_NUM_THREADS: 3
        run: ctest --test-dir build/ci-openmp --output-on-failure --parallel 2

  cpu-fuzz-smoke:
    name: CPU fuzz seed replay and discovery
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          allow-prereleases: false
      - name: Install native CPU fuzz compiler and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 libclang-rt-18-dev ninja-build libboost-dev nlohmann-json3-dev
      - name: Select locked build tools
        run: python tools/init_build_tools.py --github-path
      - name: Check corpus and driver contracts
        run: |
          mkdir -p temp
          python tools/test_fuzz_cases.py
          python tools/test_fuzz_discovery.py
          python tools/test_fuzz_replay.py
          python tools/test_fuzz_replay_shrink.py
      - name: Configure isolated instrumented CPU library
        run: >-
          cmake -S . -B temp/cpu-fuzz-smoke-build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=/usr/bin/clang++-18
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DRNS8_ENABLE_HIP=OFF -DRNS8_BUILD_FUZZERS=ON
          -DRNS8_ENABLE_HIPBLASLT=OFF -DRNS8_ENABLE_CK=OFF
          -DRNS8_ENABLE_ROCWMMA=OFF -DRNS8_ENABLE_AMDGPU_BUILTINS=OFF
          -DRNS8_ENABLE_CPU_PARALLEL=OFF -DRNS8_BUILD_SHARED=OFF
          -DRNS8_ENABLE_GMP=OFF -DRNS8_ENABLE_FLINT=OFF
          -DRNS8_HOST_SANITIZER=none -DRNS8_ENABLE_HOST_COVERAGE=OFF
          -DRNS8_BUILD_TESTS=OFF -DRNS8_BUILD_TOOLS=OFF
          -DRNS8_BUILD_BENCHMARKS=OFF -DRNS8_BUILD_EXAMPLES=OFF
      - name: Build all three fuzz targets and production objects
        run: >-
          cmake --build temp/cpu-fuzz-smoke-build --parallel 2 --target
          rns8_fuzz_plan_descriptor rns8_fuzz_export_contract rns8_fuzz_json_dependency
      - name: Inspect instrumentation, replay all named seeds and run bounded discovery
        run: >-
          python tools/fuzz_discovery.py --build temp/cpu-fuzz-smoke-build
          --nm /usr/bin/llvm-nm-18 --symbolizer /usr/bin/llvm-symbolizer-18
          --out temp/cpu-fuzz-smoke-capture --seconds 600 --runs 1000
          --discovery-seconds 5 --rss-mib 2048 --artifact-mib 256 --execute
      - name: Retain first failure and complete evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpu-fuzz-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            temp/cpu-fuzz-smoke-capture/
            temp/cpu-fuzz-smoke-build/compile_commands.json
            temp/cpu-fuzz-smoke-build/CMakeCache.txt
            temp/cpu-fuzz-smoke-build/rns8-fuzz-instrumentation-*.json
            temp/cpu-fuzz-smoke-build/rns8-analysis-targets-*.json
