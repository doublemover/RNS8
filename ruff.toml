required-version = "==0.17.3"
preview = false
# Conservative syntax floor; supported interpreter qualification is separate.
target-version = "py312"
line-length = 100
extend-exclude = ["third_party", "temp", "build", "out", "vcpkg_installed"]
force-exclude = true

[lint]
select = ["E4", "E7", "E9", "F", "B006", "B023", "RUF100"]

[format]
docstring-code-format = false
